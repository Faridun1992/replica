name: replica

services:
    nginx_replica:
        build:
            context: ./docker/nginx/local
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www
            - ./docker/nginx/local/conf.d:/etc/nginx/conf.d
            - ./docker/nginx/stage/nginx.conf:/etc/nginx/nginx.conf
        ports:
            - "${NGINX_REPLICA_HTTP_PORT:-8081}:80"
            - "${NGINX_REPLICA_HTTPS_PORT:-8444}:443"
        depends_on:
            - php_replica
            - node_replica
        healthcheck:
            test: ["CMD-SHELL", "service nginx status || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        networks:
            - app-network

    php_replica:
        environment:
            TZ: ASIA/Dushanbe
        build:
            args:
                user: ${PROJECT_USER}
                uid: ${UID}
                gid: ${GID}
            context: ./docker/php-fpm
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www
        depends_on:
            mysql_writer:
                condition: service_healthy
            mysql_reader:
                condition: service_healthy
            mysql_replication_setup:
                condition: service_completed_successfully
            redis_replica:
                condition: service_started
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        restart: unless-stopped
        networks:
            - app-network

    mysql_writer:
        image: mysql:8.4.8
        volumes:
            - database:/var/lib/mysql
            - ./docker/mysql/create-database.sql:/docker-entrypoint-initdb.d/create-database.sql
            - ./docker/mysql/replication/writer.cnf:/etc/mysql/conf.d/zz-writer.cnf:ro
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            - MYSQL_REPLICATION_PASSWORD=${MYSQL_REPLICATION_PASSWORD:?Set MYSQL_REPLICATION_PASSWORD in .env}
            - MYSQL_ROOT_HOST=%
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
        ports:
            - "${DB_WRITER_HOST_PORT:-3307}:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        networks:
            app-network:
                aliases:
                    - mysql
                    - mysql_writer

    mysql_reader:
        image: mysql:8.4.8
        volumes:
            - database_reader:/var/lib/mysql
            - ./docker/mysql/replication/reader.cnf:/etc/mysql/conf.d/zz-reader.cnf:ro
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            - MYSQL_ROOT_HOST=%
        ports:
            - "${DB_READER_HOST_PORT:-3308}:3306"
        depends_on:
            mysql_writer:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        networks:
            app-network:
                aliases:
                    - mysql_reader

    mysql_replication_setup:
        image: mysql:8.4.8
        entrypoint: ["/bin/bash", "/replication/setup-replication.sh"]
        volumes:
            - ./docker/mysql/replication/setup-replication.sh:/replication/setup-replication.sh:ro
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            - MYSQL_REPLICATION_PASSWORD=${MYSQL_REPLICATION_PASSWORD:?Set MYSQL_REPLICATION_PASSWORD in .env}
            - MYSQL_DATABASE=${DB_DATABASE}
        depends_on:
            mysql_writer:
                condition: service_healthy
            mysql_reader:
                condition: service_healthy
        restart: "no"
        networks:
            - app-network

    node_replica:
        image: node:22-alpine
        ports:
            - "${VITE_REPLICA_HOST_PORT:-5173}:5173"
        volumes:
            - ./:/var/www
        working_dir: /var/www
        tty: true
        restart: unless-stopped
        networks:
            - app-network

    redis_replica:
        image: redis:7.4.2
        volumes:
            - redis:/data
        ports:
            - "${REDIS_REPLICA_HOST_PORT:-6380}:6379"
        command: [
            "redis-server",
            "--requirepass", "${REDIS_PASSWORD}",
            "--maxmemory", "256mb",
            "--maxmemory-policy", "allkeys-lru",
            "--appendonly", "yes"
        ]
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            app-network:
                aliases:
                    - redis

volumes:
    database:
    database_reader:
    redis:
networks:
    app-network:
